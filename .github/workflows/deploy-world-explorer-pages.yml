name: Publish Nova Corp website preview to GitHub Pages

# Owner authorized a first professional public preview on 23 November 2026.
# A feature branch can publish a QA-gated preview without merging the
# incomplete long-term specification to main. No live lab access is exposed.
on:
  push:
    branches: [feature/world-explorer-site]
    paths:
      - "site/**"
      - ".github/workflows/deploy-world-explorer-pages.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preview:
    if: github.ref == 'refs/heads/feature/world-explorer-site' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: world-explorer-preview
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout reviewed website branch
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate public source data
        run: npm run validate
      - name: Type-check Astro pages
        run: npm run check
      - name: Build for GitHub Pages custom subdomain
        env:
          PUBLIC_BASE_PATH: /
        run: npm run build
      - name: Verify local links
        run: npm run test:links
      - name: Verify published object catalog routes
        run: npm run test:coverage
      - name: Verify public source document targets
        run: npm run test:sources
      - name: Verify original GPO evidence images
        run: npm run test:evidence
      - name: Verify all 100 ACL entries
        run: npm run test:acls
      - name: Interactive desktop and mobile smoke test
        timeout-minutes: 5
        run: npm run test:browser
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload verified static website
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
      # GitHub's artifact API may briefly return zero results immediately after
      # a successful upload. A failed-job rerun can create *two* same-name
      # artifacts in one run, which deploy-pages rejects. Wait for exactly one
      # artifact to be indexed before calling the deployment action.
      - name: Confirm exactly one Pages artifact is indexed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length' || echo 0)
            if [ "$count" = "1" ]; then
              echo "Pages artifact indexed and unambiguous after attempt $attempt"
              exit 0
            fi
            if [ "$count" -gt 1 ]; then
              echo "ERROR: multiple github-pages artifacts in this run; use a fresh run"
              exit 1
            fi
            echo "Pages artifact not yet indexed (attempt $attempt / 30)"
            sleep 3
          done
          echo "ERROR: uploaded Pages artifact never became discoverable"
          exit 1
      - name: Deploy first public site preview
        id: deployment
        uses: actions/deploy-pages@v5

name: World Explorer site checks
on:
  push:
    branches: [feature/world-explorer-site, feature/dark-infrastructure-experience, feature/physical-host-scroll-story, feature/scrollable-lab-sandbox, feature/home-incident-library-and-glossary, feature/source-faithful-engineering-library, feature/full-incident-records-and-journals, feature/sitewide-source-parity-and-pdf-evidence]
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/world-explorer-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/world-explorer-ci.yml"
jobs:
  journal-evidence-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - name: Extract PDF-native engineering images for human-only review
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check PyMuPDF Pillow
          python scripts/audit-pdf-images.py --output pdf-evidence-review
      - name: Keep original public PDF screenshot candidate archive
        uses: actions/upload-artifact@v4
        with:
          name: original-pdf-image-audit-unreviewed
          path: site/pdf-evidence-review/
          retention-days: 7
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PyMuPDF for exact original PDF screenshot extraction
        run: python -m pip install --quiet --disable-pip-version-check "PyMuPDF>=1.24,<2"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate public entity graph
        run: npm run validate
      - name: Astro type-check
        run: npm run check
      - name: Build static website
        run: npm run build
      - name: Validate generated HTML navigation
        run: npm run test:links
      - name: Verify full first-slice catalog and user journeys
        run: npm run test:coverage
      - name: Prove all canonical Markdown pages and in-site depth match source
        run: npm run test:references
      - name: Verify incident-to-full-journal fidelity and evidence details
        run: npm run test:incidents
      - name: Audit source depth across every published technical detail page
        run: npm run test:site-parity
      - name: Verify outbound public engineering source files exist
        run: npm run test:sources
      - name: Verify reused public screenshots and accessibility text
        run: npm run test:evidence
      - name: Verify all 100 ACL records against reviewed source
        run: npm run test:acls
      - name: Run interactive desktop and mobile browser smoke tests
        timeout-minutes: 5
        run: npm run test:browser
      - name: Capture real browser desktop and mobile screenshots
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then echo "No Chromium browser found on runner"; exit 1; fi
          mkdir -p qa-snapshots
          npm run preview -- --host 127.0.0.1 --port 4321 >/tmp/novacorp-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4321/ >/dev/null; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then cat /tmp/novacorp-preview.log; exit 1; fi
          for ENTRY in "home:/" "explorer:/company/" "investigation:/incidents/dns-client-outage/" "policy:/policies/contractor-usb/" "acls:/files/permissions/technical/"; do
            NAME="${ENTRY%%:*}"
            PAGE="${ENTRY#*:}"
            for VIEW in "desktop:1440,900" "mobile:390,844"; do
              VIEW_NAME="${VIEW%%:*}"
              SIZE="${VIEW#*:}"
              "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=1800 --window-size="$SIZE" --screenshot="qa-snapshots/${NAME}-${VIEW_NAME}.png" "http://127.0.0.1:4321${PAGE}" >/dev/null 2>&1
              test -s "qa-snapshots/${NAME}-${VIEW_NAME}.png"
            done
          done
          CHROME_PATH="$CHROME" node scripts/capture-experience-qa.mjs
          echo "Real Chromium captured ten standard screenshots and six interaction-focused screenshots. Visual acceptance remains manual."
      - name: Keep actual browser screenshots for visual review
        uses: actions/upload-artifact@v4
        with:
          name: world-explorer-browser-snapshots
          path: site/qa-snapshots/
          retention-days: 7
      - name: Keep site preview artifact for QA
        uses: actions/upload-artifact@v4
        with:
          name: world-explorer-static-preview
          path: site/dist/
          retention-days: 7
